version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: e_murojaat_postgres
    restart: always
    environment:
      POSTGRES_DB: e_murojaat
      POSTGRES_USER: emurojaat_user
      POSTGRES_PASSWORD: secure_db_password_2026
      TZ: Asia/Tashkent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emurojaat_user -d e_murojaat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: e_murojaat_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  bot:
    build: .
    container_name: e_murojaat_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://emurojaat_user:secure_db_password_2026@postgres:5432/e_murojaat
      - REDIS_URL=redis://redis:6379/0
      - TIMEZONE=Asia/Tashkent
      - APP_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

volumes:
  postgres_data:
  redis_data:
